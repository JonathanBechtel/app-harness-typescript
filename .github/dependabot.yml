version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm-deps: { patterns: ['*'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    # The Node version is pinned in lockstep across the Dockerfile, CI, and
    # package.json engines (22). Bumping it is a deliberate change made in all
    # three places at once, not a Dependabot PR against one of them.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
