name: Build image

# The image is the deploy artifact. Built once per push to main (and on demand),
# tagged with the commit sha, pushed to GHCR by default and to Azure Container
# Registry when the ACR secrets exist. Deploy workflows consume the sha tag.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Azure (OIDC)
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Login to ACR
        if: ${{ vars.ACR_NAME != '' }}
        run: az acr login --name "${{ vars.ACR_NAME }}"
      - name: Compute tags
        id: tags
        run: |
          tags="ghcr.io/${IMAGE_NAME,,}:${{ steps.meta.outputs.tag }},ghcr.io/${IMAGE_NAME,,}:latest"
          if [ -n "${{ vars.ACR_NAME }}" ]; then
            tags="$tags,${{ vars.ACR_NAME }}.azurecr.io/${{ vars.ACR_REPOSITORY || github.event.repository.name }}:${{ steps.meta.outputs.tag }}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
