name: Deploy (Databricks Apps)

# Databricks Apps deploys from SOURCE, not from an image: for a Node.js app it
# installs package.json dependencies and runs the command in
# deploy/databricks-apps/app.yaml. This workflow ships the same commit the image
# was built from, with dist/ compiled here so the platform runs the exact code the
# image runs. Required variables: DATABRICKS_HOST, DATABRICKS_APP_NAME,
# DATABRICKS_WORKSPACE_PATH; secret: DATABRICKS_TOKEN (or use OIDC federation).
# See deploy/databricks-apps/README.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [stage, prod]
        default: stage

permissions:
  contents: read

concurrency:
  group: deploy-databricks-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Assemble source bundle
        run: |
          mkdir -p bundle
          cp -r dist package.json package-lock.json README.md bundle/
          cp deploy/databricks-apps/app.yaml bundle/app.yaml
          echo "RELEASE_SHA=${{ github.sha }}" > bundle/.release
      - uses: databricks/setup-cli@main
      - name: Sync and deploy
        run: |
          databricks sync ./bundle "${{ vars.DATABRICKS_WORKSPACE_PATH }}" --full
          databricks apps deploy "${{ vars.DATABRICKS_APP_NAME }}" --source-code-path "${{ vars.DATABRICKS_WORKSPACE_PATH }}"
