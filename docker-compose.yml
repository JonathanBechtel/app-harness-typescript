# Local stack: Postgres + the app image. `npm run docker.up`.
# Day-to-day development normally runs `npm run dev` against the Postgres that
# scripts/bootstrap-env.ts starts on :5439; this file is for exercising the
# real image end-to-end before shipping.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '5439:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      args:
        GIT_SHA: local
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
      APP_ENV: stage
      PORT: '8000'
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
